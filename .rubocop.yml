inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  # Do not exclude ".worktrees/**/*": RuboCop already skips hidden directories,
  # and a run inside a nested worktree merges this file's AllCops/Exclude
  # (anchored at this checkout), which would exclude every file in it.
  Exclude:
    - "tmp/**/*"
    - "vendor/**/*"

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - spec/conformance_spec.rb
    - spec/runtime_conformance_spec.rb
    - spec/operations_conformance_spec.rb
    - spec/version_ranges_conformance_spec.rb
    - spec/legacy_ranges_conformance_spec.rb
    - spec/runtime_neutral_ranges_conformance_spec.rb
    - spec/db/**/*
    - spec/integration/**/*
    - spec/standard_flags/notifiers_spec.rb
    - spec/standard_flags/read_api_spec.rb
    - spec/standard_flags/resolution_spec.rb
    - spec/standard_flags/error_reporter_spec.rb
    - spec/standard_flags/runtime/diagnostics_spec.rb
    - spec/standard_flags/runtime/hardening_spec.rb
    - spec/standard_flags/operations/write_path_hardening_spec.rb
    - spec/standard_flags/runtime/query_cost_spec.rb
    - spec/standard_flags/runtime/runtime_off_spec.rb
    - spec/standard_flags/runtime/test_helpers_spec.rb
    - spec/standard_flags/runtime/member_reads_spec.rb

# The conformance specs generate one example per fixture case at load time.
RSpec/LeakyLocalVariable:
  Exclude:
    - spec/conformance_spec.rb
    - spec/runtime_conformance_spec.rb
    - spec/operations_conformance_spec.rb
    - spec/runtime_neutral_ranges_conformance_spec.rb
    - spec/legacy_ranges_conformance_spec.rb
    - spec/version_ranges_conformance_spec.rb

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "lib/tasks/**/*"

Metrics/MethodLength:
  Max: 20

RSpec/ExampleLength:
  Max: 15
  CountAsOne: [ "array", "hash", "heredoc", "method_call" ]

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 4
